<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Transportes Esmar">
  <defs>
    <path id="arcTop" d="M 70 256 A 186 186 0 0 1 442 256"/>
    <path id="arcBot" d="M 74 256 A 182 182 0 0 0 438 256"/>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cbf56"/>
      <stop offset="1" stop-color="#2e8b3a"/>
    </linearGradient>
  </defs>

  <!-- dark plate -->
  <circle cx="256" cy="256" r="250" fill="#0e1a10"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="url(#g)" stroke-width="6"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#7f8f7f" stroke-width="1.4" opacity="0.6"/>

  <!-- curved wordmark -->
  <path id="pTop" d="M 70 256 A 186 186 0 0 1 442 256" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="5" fill="#5fce6a">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">TRANSPORTES ESMAR</textPath>
  </text>
  <path id="pBot" d="M 74 256 A 182 182 0 0 0 438 256" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" letter-spacing="2.4" fill="#e9f4ea">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">VIAJA CÓMODO &amp; SEGURO</textPath>
  </text>

  <!-- route with two pins -->
  <g fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round">
    <path d="M 176 210 C 196 170, 320 150, 336 196 C 348 232, 220 250, 208 282 C 200 306, 300 330, 330 300"/>
  </g>
  <g fill="none" stroke="#0e1a10" stroke-width="2">
    <circle cx="176" cy="210" r="14"/>
    <circle cx="330" cy="300" r="14"/>
  </g>
  <g fill="#5fce6a">
    <circle cx="176" cy="210" r="10"/>
    <circle cx="330" cy="300" r="10"/>
  </g>
  <g fill="#ffffff">
    <circle cx="176" cy="210" r="4"/>
    <circle cx="330" cy="300" r="4"/>
  </g>
</svg>
